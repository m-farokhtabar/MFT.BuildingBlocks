name: Build and Publish NuGet Packages

on:
  push:
    branches: [master]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MFT.BuildingBlocks.slnx

      - name: Build
        run: dotnet build MFT.BuildingBlocks.slnx --configuration Release --no-restore

      - name: Pack all projects
        run: dotnet pack MFT.BuildingBlocks.slnx --configuration Release --no-build --output ./nupkgs

      - name: NuGet login (Trusted Publishing / OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: m-farokhtabar

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate